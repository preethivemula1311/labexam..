```html
<!DOCTYPE html>
<html>
<head>
<title>Shopping Website</title>
<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}
header {
    background: #222;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}
nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
}
.hero {
    background: pink;
    padding: 30px;
    text-align: center;
    animation: fade 2s;
}
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    padding: 20px;
}
.card {
    background: white;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
    transition: transform 0.3s;
}
.card:hover {
    transform: scale(1.05);
}
button {
    background: #e84365;
    color: white;
    padding: 8px;
    border: none;
}
@keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
</head>
<body>

<header>
    <h3>StyleHub</h3>
    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to StyleHub!</h1>
    <p>Shop your favourite products.</p>
</section>

<section class="products" id="products">
    <div class="card">
        <h3>T-Shirt</h3>
        <p>Price: ₹499</p>
        <button onclick="alert('Added to cart!')">Buy Now</button>
    </div>
    <div class="card">
        <h3>Shoes</h3>
        <p>Price: ₹999</p>
        <button onclick="alert('Added to cart!')">Buy Now</button>
    </div>
    <div class="card">
        <h3>Watch</h3>
        <p>Price: ₹799</p>
        <button onclick="alert('Added to cart!')">Buy Now</button>
    </div>
</section>

</body>
</html>
